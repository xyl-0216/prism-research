<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" rx="12" fill="#0d0f12" /><g font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="55" y="64" fill="#b8c5da" font-size="17">Prism Research / 棱镜研究</text><text x="53" y="160" fill="#f0f1f3" font-size="48" font-weight="500">从一张图，</text><text x="53" y="228" fill="#929baa" font-size="48" font-weight="500">展开一次研究。</text><text x="56" y="294" fill="#8a96a9" font-size="17">原始资料检索 · 条件核验 · 证据追溯</text><path d="M55 350H580" stroke="#282f39" /><text x="56" y="385" fill="#66748a" font-size="14">基于 Open Deep Research · v0.1 研究原型</text><rect x="665" y="65" width="480" height="320" rx="9" fill="#171e28" stroke="#37465a" /><path d="M665 110H1145" stroke="#37465a" /><circle cx="688" cy="87" r="4" fill="#a6baff" /><text x="702" y="93" fill="#aab9ce" font-size="13">图表核验 / 历史案例</text><text x="690" y="150" fill="#dfe7f4" font-size="20">结论能否成立？</text><text x="690" y="192" fill="#7e8da3" font-size="15">比较对象</text><text x="828" y="192" fill="#c4d1e4" font-size="15">RTX 5070 / RTX 4070</text><path d="M690 209H1118" stroke="#2e3b4e" /><text x="690" y="241" fill="#7e8da3" font-size="15">帧生成条件</text><text x="828" y="241" fill="#c4d1e4" font-size="15">与待核验主张不匹配</text><rect x="690" y="280" width="428" height="68" rx="5" fill="#25334a" /><text x="710" y="309" fill="#9eb5dd" font-size="13">核验结果</text><text x="710" y="334" fill="#dce7fa" font-size="18">证据不足，不能证明该主张。</text></g></svg>