[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-research"
version = "0.1.0"
description = "Multimodal evidence research with traceable sources and region citations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "langchain==1.3.9", "langchain-core==1.4.8", "langgraph==1.2.9",
  "langchain-openai==1.1.14", "langchain-mcp-adapters==0.2.1",
  "tavily-python==0.7.5", "mcp==1.28.1", "aiohttp==3.14.3",
  "httpx==0.28.1", "beautifulsoup4==4.14.3", "numpy==1.26.4",
  "pymupdf==1.26.0", "python-dotenv==1.2.2", "pydantic==2.11.5"
]

[project.scripts]
prism-research = "open_deep_research.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_deep_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
